# mpv — plays local files and streaming URLs (YouTube etc) via yt-dlp:
#   mpv "https://www.youtube.com/watch?v=..."
# Requires yt-dlp on PATH (pinned explicitly in the Brewfile).

# Prefer H.264 (avc1) video + best audio, falling back to whatever is best.
# Why avc1 rather than VP9/AV1: Apple Silicon has a hardware H.264 decoder, so
# avc1 plays at a fraction of the CPU and battery of a software-decoded VP9
# stream. Verified: this selector resolves to fmt 137+251 = 1920x1080 avc1 + opus.
ytdl-format=bestvideo[vcodec^=avc1]+bestaudio/best
